spring:
  profiles:
    active: dev
  application:
    name: starterkit
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:StarterKitDefaultSecretKeyForDevelopmentOnly2024}
    access-token-expiration-ms: 900000       # 15분
    refresh-token-expiration-ms: 604800000   # 7일
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  s3:
    bucket: ${AWS_S3_BUCKET:bloom-bucket}
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
