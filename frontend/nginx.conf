server {
    listen 80;
    server_name pcgear.store www.pcgear.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pcgear.store www.pcgear.store;

    ssl_certificate /etc/letsencrypt/live/pcgear.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcgear.store/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API 리버스 프록시
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator 헬스체크
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
