name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to OCI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to OCI server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e

            # 저장소 없으면 clone, 있으면 pull
            if [ ! -d ~/bloom ]; then
              git clone https://github.com/Motibidu/bloom.git ~/bloom
            fi

            cd ~/bloom
            git pull origin master

            # .env 파일 생성
            cat > .env << 'ENVEOF'
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            AWS_REGION=ap-northeast-2
            AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
            AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}
            CORS_ALLOWED_ORIGINS=https://pcgear.store
            KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            KAKAO_REDIRECT_URI=https://pcgear.store/kakao-callback
            VITE_KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
            VITE_KAKAO_JS_KEY=${{ secrets.VITE_KAKAO_JS_KEY }}
            VITE_KAKAO_REDIRECT_URI=https://pcgear.store/kakao-callback
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_VAPID_KEY=${{ secrets.VITE_FIREBASE_VAPID_KEY }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            ENVEOF

            # 빌드 및 재시작
            docker compose up -d --build

            # 헬스 체크 (최대 2분 대기)
            echo "Waiting for services to be healthy..."
            for i in $(seq 1 24); do
              if curl -sf https://pcgear.store/actuator/health > /dev/null 2>&1; then
                echo "Health check passed!"
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed after 2 minutes"
            exit 1
